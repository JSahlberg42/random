services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kepparikauppa-frontend
    ports:
      - "8080:8080"
    depends_on:
      - backend
    networks:
      - keppari-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kepparikauppa-backend
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-keppari}:${POSTGRES_PASSWORD:-keppari_dev}@db:5432/${POSTGRES_DB:-kepparikauppa}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me-in-production}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - keppari-net

  db:
    image: postgres:17-alpine
    container_name: kepparikauppa-db
    env_file:
      - .env
    volumes:
      - keppari_db_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-keppari} -d ${POSTGRES_DB:-kepparikauppa}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - keppari-net

networks:
  keppari-net:
    driver: bridge

volumes:
  keppari_db_data:
